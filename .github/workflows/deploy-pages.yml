name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: bun install

      - name: Copy/encoding check
        run: bun run check:copy

      - name: Prepare build env (Pages vs custom domain)
        shell: bash
        env:
          SITE_URL_OVERRIDE: ${{ vars['SITE_URL'] }}
          PUBLIC_SITE_BASE_OVERRIDE: ${{ vars['PUBLIC_SITE_BASE'] }}
          PUBLIC_FORM_ENDPOINT_SECRET: ${{ secrets['PUBLIC_FORM_ENDPOINT'] }}
        run: |
          set -euo pipefail

          # Defaults that work for GitHub project Pages:
          #   https://<owner>.github.io/<repo>/
          # and base '/<repo>/'
          default_site_url="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"

          # Optional overrides (recommended):
          # - Repo variables (Settings → Secrets and variables → Actions → Variables)
          #     SITE_URL=https://officeprovisionz.com/
          #     PUBLIC_SITE_BASE=/
          # - Secret (for static form providers)
          #     PUBLIC_FORM_ENDPOINT=https://formspree.io/f/xxxxxxx

          if [ -n "${SITE_URL_OVERRIDE}" ]; then
            echo "SITE_URL=${SITE_URL_OVERRIDE}" >> "$GITHUB_ENV"
          else
            echo "SITE_URL=${default_site_url}" >> "$GITHUB_ENV"
          fi

          # Only set PUBLIC_SITE_BASE when provided; otherwise Astro will infer it during Actions builds.
          if [ -n "${PUBLIC_SITE_BASE_OVERRIDE}" ]; then
            echo "PUBLIC_SITE_BASE=${PUBLIC_SITE_BASE_OVERRIDE}" >> "$GITHUB_ENV"
          fi

          if [ -n "${PUBLIC_FORM_ENDPOINT_SECRET}" ]; then
            echo "PUBLIC_FORM_ENDPOINT=${PUBLIC_FORM_ENDPOINT_SECRET}" >> "$GITHUB_ENV"
          fi

      - name: Build (static)
        env:
          ASTRO_TELEMETRY_DISABLED: 1
        run: bun run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy_3.outputs.page_url || steps.deploy_2.outputs.page_url || steps.deploy_1.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Diagnostics (Pages config)
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            try {
              const pages = await github.rest.repos.getPages({ owner, repo });
              core.info('Pages config:');
              core.info(JSON.stringify(pages.data, null, 2));
            } catch (e) {
              core.warning(`getPages failed: ${e?.message ?? e}`);
            }

            try {
              const latest = await github.rest.repos.getLatestPagesBuild({ owner, repo });
              core.info('Latest Pages build:');
              core.info(JSON.stringify(latest.data, null, 2));
            } catch (e) {
              core.warning(`getLatestPagesBuild failed: ${e?.message ?? e}`);
            }

            // Environment protection rules can block deployments indefinitely.
            // If the repo has required reviewers for the `github-pages` environment, it can appear stuck.
            try {
              const env = await github.rest.repos.getEnvironment({
                owner,
                repo,
                environment_name: 'github-pages',
              });
              core.info('Environment config (github-pages):');
              core.info(JSON.stringify(env.data, null, 2));
            } catch (e) {
              core.warning(`getEnvironment failed: ${e?.message ?? e}`);
            }

      - name: Diagnostics (GitHub API connectivity)
        run: |
          set -euo pipefail
          echo "Testing connectivity to GitHub API..."
          curl -fsSLI --max-time 20 https://api.github.com | head -n 20
          echo "Testing connectivity to GitHub..."
          curl -fsSLI --max-time 20 https://github.com | head -n 20

      - name: Deploy (attempt 1)
        id: deploy_1
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Backoff (20s)
        if: steps.deploy_1.outcome == 'failure'
        run: sleep 20

      - name: Deploy (attempt 2)
        id: deploy_2
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Backoff (60s)
        if: steps.deploy_2.outcome == 'failure'
        run: sleep 60

      - name: Deploy (attempt 3)
        id: deploy_3
        uses: actions/deploy-pages@v4

      - name: Fail if all deploy attempts failed
        if: steps.deploy_1.outcome == 'failure' && steps.deploy_2.outcome == 'failure' && steps.deploy_3.outcome == 'failure'
        run: exit 1
