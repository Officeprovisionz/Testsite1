name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    name: CI (Node 24)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install
        run: bun install

      - name: Format check
        run: bun run format

      - name: Copy/encoding check
        run: bun run check:copy

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        env:
          PUBLIC_SITE_BASE: /
          SITE_URL: https://example.invalid/
          ASTRO_TELEMETRY_DISABLED: 1
        run: bun run build
