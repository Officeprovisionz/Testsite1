name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install
        run: bun install

      - name: Copy/encoding check
        run: bun run check:copy

      - name: Check static form endpoint
        run: |
          if [ -z "${{ secrets.PUBLIC_FORM_ENDPOINT }}" ]; then
            echo "::warning::PUBLIC_FORM_ENDPOINT secret is not set. Contact form submissions will not work until it is configured in repo Settings → Secrets."
          fi

      - name: Build (static)
        env:
          # Custom domain deployment (root).
          # If you ever switch back to a project Pages URL (/<repo>/), restore the previous values.
          PUBLIC_SITE_BASE: /
          SITE_URL: https://officeprovisionz.com/
          # Static form endpoint (Formspree/Basin/etc.).
          # Add this in GitHub repo settings: Settings → Secrets and variables → Actions.
          # Name: PUBLIC_FORM_ENDPOINT
          # Value: https://formspree.io/f/xxxxxxxx (example)
          PUBLIC_FORM_ENDPOINT: ${{ secrets.PUBLIC_FORM_ENDPOINT }}
          PUBLIC_ENABLE_ANALYTICS: ${{ vars.PUBLIC_ENABLE_ANALYTICS }}
          PUBLIC_PLAUSIBLE_DOMAIN: ${{ vars.PUBLIC_PLAUSIBLE_DOMAIN }}
          PUBLIC_PLAUSIBLE_SRC: ${{ vars.PUBLIC_PLAUSIBLE_SRC }}
          PUBLIC_ENABLE_SERVICE_WORKER: 'true'
          PUBLIC_SENTRY_DSN: ${{ secrets.PUBLIC_SENTRY_DSN }}
          ASTRO_TELEMETRY_DISABLED: 1
        run: bun run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
